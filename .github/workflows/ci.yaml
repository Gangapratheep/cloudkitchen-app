# =============================================================================
# CloudKitchen CI/CD — build, scan, push, and GitOps-update
# -----------------------------------------------------------------------------
# Pipeline overview:
#   build          : matrix over all 9 services -> docker build, Trivy scan
#                    (fail on HIGH/CRITICAL), push to ECR (tags: <sha>, latest).
#   update-gitops  : on push to main only -> bump the image string for each
#                    service in helm/cloudkitchen/values.yaml and commit it back.
#                    ArgoCD (not this pipeline) performs the actual deployment.
#
# This pipeline NEVER runs `helm upgrade` or `kubectl apply` — deployment is
# strictly ArgoCD's responsibility. The only "deploy" action here is the git
# commit of updated image tags.
# =============================================================================
name: CI (AWS / ECR)

# ---- Trigger: run automatically on push to main -----------------------------
on:
  push:
    branches: [main]

# ---- Concurrency: cancel superseded runs ------------------------------------
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---- Environment variables --------------------------------------------------
env:
  AWS_REGION: us-east-1
  # Hardcoded AWS ECR registry host (replace with your account ID/region if different)
  ECR_REGISTRY: 295493126166.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ===========================================================================
  # build: build, scan and push every service image IN PARALLEL via a matrix.
  # ===========================================================================
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - restaurant-service
          - menu-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - frontend

    steps:
      # ---- 1. Checkout source ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 2. Compute a short (7-char) git SHA used as the image tag ----------
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ---- 3. Authenticate to AWS with static IAM access keys ----------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- 4. Log in to Amazon ECR -------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ---- 5. Set up Docker Buildx (layer caching + reproducible builds) -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 6. Build the image locally (for scanning) -------------------------
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.vars.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # ---- 7. Trivy image scan — fail on HIGH/CRITICAL CVEs ------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.vars.outputs.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # ---- 8. Push to ECR (only on main, after clean scan) -------------------
      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.vars.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  # ===========================================================================
  # update-gitops: bump image strings in helm/cloudkitchen/values.yaml + commit.
  # ===========================================================================
  update-gitops:
    name: update-gitops
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      # ---- 1. Checkout repo at branch HEAD (so we can push) ------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      # ---- 2. Compute the same short SHA used for image tags -----------------
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ---- 3. Install yq (YAML processor) ------------------------------------
      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      # ---- 4. Patch the per-service `image:` string in the chart values ------
      - name: Update image tags in helm/cloudkitchen/values.yaml
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          FILE="helm/cloudkitchen/values.yaml"
          SERVICES="auth-service user-service restaurant-service menu-service \
                    order-service payment-service delivery-service \
                    notification-service frontend"

          # kebab-case dir -> camelCase values key (auth-service -> authService).
          to_camel() {
            local IFS='-'; read -ra p <<< "$1"; local out="${p[0]}"
            for w in "${p[@]:1}"; do out+="${w^}"; done
            echo "$out"
          }

          for svc in $SERVICES; do
            key="$(to_camel "$svc")"
            img="${ECR_REGISTRY}/${svc}:${NEW_TAG}"
            echo "Setting .${key}.image = ${img}"
            yq -i ".${key}.image = \"${img}\"" "$FILE"
          done
          echo "----- resulting $FILE -----"
          cat "$FILE"

      # ---- 5. Commit & push the updated tags. ArgoCD takes it from here -------
      - name: Commit & push GitOps update
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "cloudkitchen-ci[bot]"
          git config user.email "ci-bot@cloudkitchen.example.com"
          if git diff --quiet -- helm/cloudkitchen/values.yaml; then
            echo "No image tag changes to commit."
            exit 0
          fi
          git add helm/cloudkitchen/values.yaml
          git commit -m "ci(gitops): bump image tags to ${NEW_TAG} [skip ci]"
          git push origin main
