# ============================================================================
# CloudKitchen umbrella chart — default values
# ----------------------------------------------------------------------------
# Flat, explicit, one block per service. Each microservice block drives its own
# <svc>-deployment.yaml / -service.yaml / -configmap.yaml / -secret.yaml / -hpa.yaml.
# This is THE values file ArgoCD renders with and CI patches (per-service image
# strings) — there are no separate per-environment override files.
# ============================================================================

# Namespace every resource is created in.
namespace: cloudkitchen

# Container registry that holds the service images (AWS ECR for KOPS/EKS).
imageRegistry: 295493126166.dkr.ecr.ap-south-1.amazonaws.com

# -----------------------------------------------------------------------------
# Backend microservices (all listen on :8080, expose /healthz and /readyz)
# -----------------------------------------------------------------------------
authService:
  deploymentname: auth-service-deployment
  servicename: auth-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/auth-service:latest
  replicas: 1
  port: 8080
  schema: auth
  hpa: auth-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

userService:
  deploymentname: user-service-deployment
  servicename: user-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/user-service:latest
  replicas: 1
  port: 8080
  schema: users
  hpa: user-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

restaurantService:
  deploymentname: restaurant-service-deployment
  servicename: restaurant-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/restaurant-service:latest
  replicas: 1
  port: 8080
  schema: restaurants
  hpa: restaurant-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

menuService:
  deploymentname: menu-service-deployment
  servicename: menu-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/menu-service:latest
  replicas: 1
  port: 8080
  schema: menu
  hpa: menu-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

orderService:
  deploymentname: order-service-deployment
  servicename: order-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/order-service:latest
  replicas: 1
  port: 8080
  schema: orders
  hpa: order-service-autoscaler
  minReplicas: 1
  maxReplicas: 6

paymentService:
  deploymentname: payment-service-deployment
  servicename: payment-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/payment-service:latest
  replicas: 1
  port: 8080
  schema: payments
  hpa: payment-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

deliveryService:
  deploymentname: delivery-service-deployment
  servicename: delivery-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/delivery-service:latest
  replicas: 1
  port: 8080
  schema: delivery
  hpa: delivery-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

notificationService:
  deploymentname: notification-service-deployment
  servicename: notification-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/notification-service:latest
  replicas: 1
  port: 8080
  schema: notifications
  hpa: notification-service-autoscaler
  minReplicas: 1
  maxReplicas: 5

# -----------------------------------------------------------------------------
# Frontend (React build served by non-root nginx on :8080)
# -----------------------------------------------------------------------------
frontend:
  deploymentname: frontend-deployment
  servicename: frontend-service
  image: 295493126166.dkr.ecr.ap-south-1.amazonaws.com/frontend:latest
  replicas: 1
  port: 8080
  hpa: frontend-autoscaler
  minReplicas: 1
  maxReplicas: 4

# -----------------------------------------------------------------------------
# In-cluster data stores
# -----------------------------------------------------------------------------
postgres:
  name: postgres
  servicename: postgres
  image: postgres:16-alpine
  port: 5432
  storage: 10Gi
  storageClass: gp2   # AWS EBS default storage class

redis:
  name: redis
  servicename: redis
  image: redis:7-alpine
  port: 6379

nats:
  name: nats
  servicename: nats
  image: nats:2.10-alpine
  clientPort: 4222
  monitorPort: 8222
  storage: 5Gi
  storageClass: gp2

# -----------------------------------------------------------------------------
# Shared database connection
# -----------------------------------------------------------------------------
db:
  host: postgres
  port: "5432"
  name: cloudkitchen
  sslmode: disable

# -----------------------------------------------------------------------------
# Ingress (Traefik) + TLS
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  tls: true
  host: vijaygiduthuri.in
  lbIP: 136.119.163.255
  entryPoint: websecure
  tlsSecretName: cloudkitchen-tls
  clusterIssuer: letsencrypt-prod

# -----------------------------------------------------------------------------
# Secrets (DEV DEFAULTS ONLY — override per-environment / use a secrets manager)
# -----------------------------------------------------------------------------
secrets:
  dbUser: cloudkitchen
  dbPassword: cloudkitchen-dev-password
  jwtSecret: changeme-use-a-strong-secret-in-production
  jwtExpiry: 24h
  redisPassword: "ShopUser#4kLm4"
